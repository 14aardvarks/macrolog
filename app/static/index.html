<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f6f7f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121614" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Macrolog">
<title>Macrolog</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192">
<link rel="stylesheet" href="/style.css">
<noscript><style>#splash { display: none; }</style></noscript>
</head>
<body>
<div id="splash" aria-hidden="true"><img src="/icon-192.png" width="96" height="96" alt=""></div>
<noscript><p class="msg error">Macrolog needs JavaScript.</p></noscript>
<main id="main" tabindex="-1" aria-live="off"></main>
<nav id="nav" aria-label="Main" hidden>
  <button type="button" data-go="today">Today</button>
  <button type="button" data-go="add">Add</button>
  <button type="button" data-go="settings">Settings</button>
</nav>
<script>setTimeout(function () { var s = document.getElementById("splash"); if (s && s.parentNode) s.parentNode.removeChild(s); }, 6000);</script>
<script type="module" src="/js/app.js"></script>
</body>
</html>
